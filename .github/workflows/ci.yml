name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality, package, and Pi loader
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.19.0
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run quality gate
        run: npm run check
      - name: Smoke test exact Pi loader
        run: npm run test:smoke:pi
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Verify package contents
        run: npm pack --dry-run
      - name: Immutable Git install/load smoke
        env:
          PI_GOAL_GIT_SMOKE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          PI_GOAL_GIT_SMOKE_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run test:smoke:git
